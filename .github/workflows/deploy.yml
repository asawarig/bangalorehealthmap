# Builds the map and publishes it to GitHub Pages on every push to main.
#
# Before the first run: Settings → Pages → Build and deployment → Source →
# "GitHub Actions". The site then lives at
# https://<owner>.github.io/<repo>/ and the Webflow iframe points at
# https://<owner>.github.io/<repo>/embed/
#
# To publish at a custom domain instead, set the SITE_URL and BASE_PATH
# repository variables (Settings → Secrets and variables → Actions → Variables)
# to e.g. https://wellness.plumhq.com and /.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Falls back to the defaults in astro.config.mjs when unset.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          # Optional override for the key checked into src/lib/basemap.js.
          PUBLIC_CARTO_KEY: ${{ secrets.CARTO_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
